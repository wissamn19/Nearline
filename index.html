<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nearline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
  </svg>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#F43F6E"/><stop offset=".5" stop-color="#4289FF"/><stop offset="1" stop-color="#0E9F5B"/></linearGradient></defs>
        <path d="M3 16h26" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="6" cy="16" r="4.5" fill="#F43F6E"/><circle cx="16" cy="16" r="4.5" fill="#4289FF"/><circle cx="26" cy="16" r="4.5" fill="#0E9F5B"/>
      </svg>
      Nearline
    </div>
    <span class="saved">Saved on this device</span>
  </header>

  <main class="app">
    <section class="hero">
      <h1 class="headline">Capture anything.<br>Nearline <span class="scribble">files it.</span></h1>
      <p class="sub">Type a task, a note or a link. It lands on the right line.</p>
      <div class="capture">
        <div class="field">
          <input id="myInput" type="text" placeholder="What's on your mind?" autocomplete="off" autofocus>
          <span id="preview" class="preview" hidden></span>
        </div>
        <button id="captureBtn" class="cta" type="button">Capture</button>
      </div>
      <p class="hint">Plain text becomes a task. Start with ! for a note. Add @17:30 for a reminder. Press / to jump here.</p>
    </section>

    <section class="timeline" aria-label="Captured items">
      <svg class="road" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true">
        <path class="road-edge" d="M0 44 L166.7 44 C333 44 333 100 500 100 C667 100 667 44 833.3 44 L1000 44"/>
        <path id="roadPath" class="road-bed" d="M0 44 L166.7 44 C333 44 333 100 500 100 C667 100 667 44 833.3 44 L1000 44"/>
        <path class="road-line" d="M0 44 L166.7 44 C333 44 333 100 500 100 C667 100 667 44 833.3 44 L1000 44"/>
      </svg>
      <span class="flag start">Start</span>
      <span class="flag end">Filed</span>
      <div class="lane task" data-type="task">
        <button class="node" type="button" aria-label="Add a task"><span class="dot"></span>Task<span class="count">0</span></button>
        <input class="node-input" type="text" placeholder="Add a task" autocomplete="off" hidden>
        <ul id="tasksList" data-empty="No tasks yet. Type one above."></ul>
      </div>

      <div class="lane note" data-type="note">
        <button class="node" type="button" aria-label="Add a note"><span class="dot"></span>Note<span class="count">0</span></button>
        <input class="node-input" type="text" placeholder="Add a note" autocomplete="off" hidden>
        <ul id="notesList" data-empty="No notes yet. Start with ! to write one."></ul>
      </div>

      <div class="lane link" data-type="link">
        <button class="node" type="button" aria-label="Add a link"><span class="dot"></span>Link<span class="count">0</span></button>
        <input class="node-input" type="text" placeholder="Paste a link" autocomplete="off" hidden>
        <ul id="linksList" data-empty="No links yet. Paste one above."></ul>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
